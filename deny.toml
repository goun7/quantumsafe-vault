# cargo-deny policy (Round 26) — licenses, advisories, bans, sources.
#
# Run: `cargo deny check` (all three) — wired into the CI security-audit
# job and the local gate. Every exception below carries its reason.

[graph]
# The two architectures the vault/bridge actually ship on. Listing them
# keeps target-gated MCU-only deps OUT of the graph where they are
# irrelevant — including atomic-polyfill (see advisories below): it
# exists in Cargo.lock only for no-atomic MCUs (avr/riscv32i) and is
# never compiled here.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]

[advisories]
yanked = "deny"
# RUSTSEC-2023-0089 (atomic-polyfill, UNMAINTAINED not vulnerable) does
# not need an ignore HERE: the graph targets above exclude the MCU-only
# edge (postcard 1.1.3 → heapless 0.7.17 → atomic-polyfill) entirely.
# `cargo audit` scans the raw Cargo.lock and CANNOT target-filter — the
# same justification lives as its --ignore in ci.yml and the local gate.
#
# ROUND 36 (17 Ekim 2026) — the zip line, RE-EVALUATED at the harness
# bump, exactly as the Round-34 entry demanded. Two facts changed:
# (1) zip 0.6.6 is NO LONGER YANKED upstream — the exact-version
# yanked-ignore is stale (cargo-deny FAILS on a yanked-ignore that
# matches no yanked crate: "yanked crate not detected"), so it is
# REMOVED; `yanked = "deny"` stays armed for everything else.
# (2) What replaced the yank: RustSec published RUSTSEC-2026-0367
# (SUID/SGID preservation), RUSTSEC-2026-0368 (symlink escape) and
# RUSTSEC-2026-0369 (permissions through symlinks, 9.1 critical) against
# zip's extract() family — fixed only in zip >=9.0.0, while `zip` is a
# BUILD-TIME-ONLY OPTIONAL dependency of the `bitcoind` TEST harness
# (dev-dependency: `cargo build --release` never compiles it; no shipped
# binary contains it) whose newest release (bitcoind 0.42.0, bumped this
# round) still requires `zip ^0.6.6`. A semver-incompatible 9.x cannot
# be forced through that requirement from this side. The three advisory
# IDs are therefore ignored HERE (deny scans the same RustSec DB) AND
# as `cargo audit --ignore` flags in ci.yml and scripts/round_gate.sh —
# byte-identical reasoning at all three homes — because the only
# extraction path runs on archives fetched over HTTPS from
# bitcoincore.org inside test runs, never on adversarial input.
# Re-evaluate at the next harness bump (the handover pack's release steps).
#
# ROUND 41 (25 October 2026) — RUSTSEC-2026-0387 (crypto-bigint 0.5.5,
# "multiple timing variability issues", published 2026-10-23, i.e. two days
# AFTER the last green run). The crate enters the graph through exactly one
# edge: frost-secp256k1-tr 3.0.0 → k256 0.13.4 → elliptic-curve 0.13.8. The
# fixed line is crypto-bigint >= 0.7.6, which k256 0.13 cannot consume; k256
# 0.14 exists but the newest frost-secp256k1-tr (3.0.0) pins 0.13. The MAIN
# vault spend path does not touch it — that path signs through the
# libsecp256k1 `secp256k1` bindings (constant-time C, independently audited).
# Blast radius: the FROST threshold ceremony (inheritance kit / frost-spend),
# which each holder runs on their own machine; the advisory class is
# timing-variability observable only by a local attacker timing the victim's
# signing loop. Ignored here AND as `cargo audit --ignore` in ci.yml and
# scripts/round_gate.sh (byte-identical reasoning, three homes). Re-evaluate
# the moment frost-secp256k1-tr depends on k256 >= 0.14.
ignore = [
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
    "RUSTSEC-2026-0387",
]

[licenses]
# The workspace is MIT; dependencies must stay inside this whitelist.
# Anything unlisted or non-spdx FAILS the check — new deps need an
# explicit decision, not a silent adoption.
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MITNFA",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
# Multiple versions are noisy but legal (semver-incompatible splits are
# an upstream decision); wildcard deps are a reproducibility hazard and
# stay VISIBLE as warnings — only the workspace's own path crates carry
# them (version-less path deps resolve as `*`, the intended workspace
# shape; pinning a literal version next to every path would drift on
# each release bump). Default features are the workspace's call to
# make, never a transitive dependency's — so EXTERNAL defaults are
# allowed (upstream's design) while workspace defaults stay visible as
# warnings (the members are path deps: their defaults are deliberate).
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"
workspace-default-features = "warn"
external-default-features = "allow"

[sources]
# Reproducible builds from registries only: no git dependencies, no
# unknown registries, no vendored shadows.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
