[package]
name = "qsv-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "QuantumSafe-Vault core: NUMS Taproot vault, Miniscript policies, two-stage unvault covenant, heir commitments, PSBT hardware flow, heartbeat scheduler, consensus verification"

[features]
default = []
# Enables libbitcoinconsensus (Bitcoin Core v26 script interpreter, C++).
# Verifies every spend against the reference consensus engine.
consensus = ["dep:bitcoinconsensus"]

[dependencies]
bitcoin.workspace = true
miniscript.workspace = true
secp256k1.workspace = true
sha2.workspace = true
hex.workspace = true
# FROST threshold signatures (docs/04 §4.1): BIP-340-compatible secp256k1-tr
# ciphersuite; serde only through the crate's own serialization codec.
frost-secp256k1-tr = { version = "3.0", default-features = false, features = ["serialization"] }
rand_core = { version = "0.6", features = ["getrandom"] }
bitcoinconsensus = { version = "0.106", optional = true }

[dev-dependencies]
qsv-pqc = { path = "../qsv-pqc" }
sha2.workspace = true
# Test-only: the official SLIP-0039 vector file is parsed in `slip39` tests.
serde_json = "1"
proptest = "1.11"
