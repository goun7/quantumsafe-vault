[package]
name = "qsv-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "QuantumSafe-Vault operator CLI: end-to-end vault setup, hybrid spend and inheritance demos"

[[bin]]
name = "qsv-cli"
path = "src/main.rs"

[dependencies]
qsv-core = { path = "../qsv-core", features = ["consensus"] }
qsv-pqc = { path = "../qsv-pqc" }
qsv-cosigner = { path = "../qsv-cosigner" }
qsv-node = { path = "../qsv-node" }
bitcoin.workspace = true
secp256k1.workspace = true
hex.workspace = true
sha2.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand_core = { version = "0.6", features = ["getrandom"] }
clap = { version = "4", features = ["derive"] }
# TLS client half of the bridge e2e (server side lives in qsv-cosigner).
rustls = { version = "0.23", default-features = false, features = ["std", "aws_lc_rs"] }
# QR rendering for the printable estate letter (unicode terminal art only;
# image feature disabled — zero native deps).
qrcode = { version = "0.14", default-features = false }

[dev-dependencies]
# Live regtest end-to-end: the estate-letter/verify-estate flow is proven
# against a real bitcoind (v28.2, downloaded at build time), same as qsv-node.
bitcoind = { version = "0.42", features = ["download", "28_2"] }
tempfile = "3"
# Self-signed loopback certs for the TLS bridge e2e (cached, no network).
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "aws_lc_rs"] }

[target.'cfg(unix)'.dev-dependencies]
# GRACEFUL SHUTDOWN e2e (Round 17): std Child::kill() is SIGKILL, which
# would bypass the handler under test — the drill must send a real SIGTERM.
libc = "0.2"
